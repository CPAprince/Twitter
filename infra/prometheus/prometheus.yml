global:
    scrape_interval: 5s
    
rule_files:
    - /etc/prometheus/alerts.yml

scrape_configs:
    - job_name: symfony
      metrics_path: /metrics
      static_configs:
          - targets:
                - php:80

    - job_name: rabbitmq
      static_configs:
          - targets:
                - rabbitmq:15692
